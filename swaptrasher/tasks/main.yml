---

- name: check active swap
  ansible.builtin.shell: swapon --show --noheadings
  register: swap_status
  changed_when: false

- name: disable swap
  ansible.builtin.shell: swapoff -a
  when: swap_status.stdout | trim != ''
  become: yes

- name: remove swapfile
  ansible.builtin.file:
    path: "{{ swap_file }}"
    state: absent
  become: yes

- name: remove swapfile from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*{{ swap_file | regex_escape }}\s+'
    state: absent
  become: yes
